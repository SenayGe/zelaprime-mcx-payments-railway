# extensions/mcx-thankyou/shopify.extension.toml
api_version = "2025-07"

[capabilities]
api_access = true
network_access = true

[[extensions]]
uid = "62eb9698-2819-2792-14ce-43b0e373f8f521dd25c4"
type = "ui_extension"
name = "MCX Thank You Test"
handle = "mcx-thank-you-test"

[extensions.capabilities]
network_access = true

[[extensions.targeting]]
target = "purchase.thank-you.block.render"
module = "./src/ThankYou.jsx"
export = "thankYouBlock"

[[extensions.targeting]]
target = "customer-account.order-status.block.render"
module = "./src/ThankYou.jsx"
export = "orderDetailsBlock"






