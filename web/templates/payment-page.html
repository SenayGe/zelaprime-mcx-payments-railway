<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Multicaixa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #111111;
      --muted: #6b6b6b;
      --line: #e6e6e6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      height: 28px;
      width: auto;
      display: block;
    }

    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 24px 16px 32px;
    }

    .surface {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .order-line {
      padding: 14px 20px;
      font-size: 14px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }

    .order-line strong {
      color: var(--text);
      font-weight: 600;
    }

    .iframe-container {
      width: 100%;
      min-height: 816px;
      background: #ffffff;
      position: relative;
    }

    .iframe-container iframe {
      width: 100%;
      height: 816px;
      min-width: 562px;
      border: none;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #e3e3e3;
      border-top-color: #111111;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .state {
      padding: 28px 20px;
      text-align: center;
    }

    .state h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .state p {
      font-size: 14px;
      color: var(--muted);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 12px 16px;
      }

      .surface {
        border-radius: 10px;
      }

      .iframe-container {
        min-height: 600px;
      }

      .iframe-container iframe {
        height: 600px;
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <img
      class="logo"
      src="https://cdn.shopify.com/s/files/1/0604/1052/7806/files/logo-main.jpg?v=1758738859"
      alt="Zela"
    >
  </header>

  <main class="main">
    <div class="surface">
      <div class="order-line" id="orderLine">Pedido <strong id="orderNumber">{{ORDER_NUMBER}}</strong></div>

      <div class="iframe-container" id="loadingSection">
        <div class="loading">
          <div class="spinner"></div>
          <p>A carregar pagamento...</p>
        </div>
      </div>

      <div class="iframe-container hidden" id="iframeSection">
        <iframe id="paymentFrame" src="{{FRAME_URL}}" allow="payment"></iframe>
      </div>

      <div class="state hidden" id="successSection">
        <h2>Pagamento confirmado</h2>
        <p>O seu pagamento foi processado com sucesso. Pode fechar esta janela.</p>
      </div>

      <div class="state hidden" id="errorSection">
        <h2>Erro no pagamento</h2>
        <p id="errorMessage">Ocorreu um erro ao processar o pagamento.</p>
      </div>
    </div>
  </main>

  <script>
    const PAYMENT_ID = '{{PAYMENT_ID}}';
    const STATUS_URL = '/api/mcx/sessions/' + PAYMENT_ID + '/status';
    let pollInterval = null;

    const urlParams = new URLSearchParams(window.location.search);
    const completed = urlParams.get('completed');

    if (completed === 'true') {
      checkStatus();
    }

    function init() {
      const orderNumberEl = document.getElementById('orderNumber');
      const orderLine = document.getElementById('orderLine');
      if (!orderNumberEl || !orderNumberEl.textContent.trim()) {
        orderLine.classList.add('hidden');
      }

      const frameEl = document.getElementById('paymentFrame');
      const frameUrl = frameEl ? frameEl.getAttribute('src') : '';

      if (frameUrl && /^https?:\/\//i.test(frameUrl)) {
        document.getElementById('loadingSection').classList.add('hidden');
        document.getElementById('iframeSection').classList.remove('hidden');
        startPolling();
      } else {
        showError('URL de pagamento indisponível');
      }
    }

    function startPolling() {
      pollInterval = setInterval(checkStatus, 3000);
    }

    function stopPolling() {
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
    }

    async function checkStatus() {
      try {
        const response = await fetch(STATUS_URL);
        const data = await response.json();

        if (data.status === 'PAID') {
          showSuccess();
          stopPolling();
        } else if (data.status === 'FAILED' || data.status === 'EXPIRED') {
          showError('O pagamento falhou ou expirou.');
          stopPolling();
        } else if (data.status === 'CANCELLED') {
          showError('O pagamento foi cancelado.');
          stopPolling();
        }
      } catch (err) {
        console.error('Error checking status:', err);
      }
    }

    function showSuccess() {
      document.getElementById('loadingSection').classList.add('hidden');
      document.getElementById('iframeSection').classList.add('hidden');
      document.getElementById('errorSection').classList.add('hidden');
      document.getElementById('successSection').classList.remove('hidden');

      if (window.opener) {
        setTimeout(() => {
          window.opener.postMessage({ type: 'MCX_PAYMENT_SUCCESS', paymentId: PAYMENT_ID }, '*');
          window.close();
        }, 2000);
      }
    }

    function showError(message) {
      document.getElementById('loadingSection').classList.add('hidden');
      document.getElementById('iframeSection').classList.add('hidden');
      document.getElementById('successSection').classList.add('hidden');
      document.getElementById('errorSection').classList.remove('hidden');
      document.getElementById('errorMessage').textContent = message;
    }

    window.addEventListener('message', function(event) {
      if (event.origin !== 'https://cerpagamentonline.emis.co.ao') return;

      if (event.data && event.data.id) {
        checkStatus();
      }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
